# Compila el Android App Bundle (.aab) que pide Play Console.
#
# Es un artefacto de Actions, no una release: a diferencia del APK suelto de
# "Publicar APK", el .aab no se reparte por fuera de una tienda — la primera
# carga a Play Console siempre es manual, así que esto solo deja el archivo
# listo para bajar y subir a mano.
name: Publicar bundle (Play Store)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Aceptar licencias e instalar el SDK que pide el proyecto
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Pruebas
        # Tambien las de :compartido: ahi vive el contrato con el panel, y un
        # release que las salte podria publicar modelos que no decodifican.
        run: ./gradlew :app:testDebugUnitTest :compartido:testDebugUnitTest --no-daemon

      - name: Preparar la clave de firma
        # Misma clave que "Publicar APK": si el secreto todavia no existe, el
        # bundle sale firmado con la de depuracion y Play lo va a rechazar al
        # subirlo. Hace falta el secreto cargado para que esto sirva de algo.
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$RUNNER_TEMP/keystore"
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
          fi

      - name: Compilar el bundle
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/keystore/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # -PparaTienda apaga los splits por ABI: un bundle no puede convivir
        # con ellos (AGP lo rechaza, ver https://issuetracker.google.com/402800800),
        # y para Play no hacen falta — la propia tienda arma el paquete por
        # dispositivo a partir de este mismo .aab.
        run: ./gradlew :app:bundleRelease -PparaTienda=true --no-daemon

      - name: Guardar el bundle y su mapa de R8
        uses: actions/upload-artifact@v4
        with:
          name: caaguazu-bundle
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
