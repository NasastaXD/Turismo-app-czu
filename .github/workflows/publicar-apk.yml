# Compila el APK y lo publica como release descargable.
#
# Dos formas de dispararlo:
#   - empujando un tag `v*`, que ata la release a un punto exacto del historial;
#   - a mano desde Actions, indicando la version. En ese caso el tag lo crea la
#     propia publicacion sobre el commit que se compilo.
name: Publicar APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a publicar, sin la v (ej: 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Aceptar licencias e instalar el SDK que pide el proyecto
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Pruebas
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Compilar release
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Preparar los archivos a publicar
        id: preparar
        env:
          ENTRADA: ${{ github.event.inputs.version }}
        run: |
          # Por tag manda el tag; a mano, la version que se indico.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${ENTRADA}"
          fi
          VERSION="${TAG#v}"

          mkdir -p entrega
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk    "entrega/caaguazu-$VERSION-arm64.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk  "entrega/caaguazu-$VERSION-armv7.apk"
          cp app/build/outputs/apk/release/app-universal-release.apk    "entrega/caaguazu-$VERSION-universal.apk"
          # Sin el mapa de R8, un registro de error de release es ilegible
          # incluso para quien escribio el codigo. Va adjunto a cada publicacion.
          cp app/build/outputs/mapping/release/mapping.txt "entrega/mapping-$VERSION.txt"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh entrega

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.preparar.outputs.tag }}
          VERSION: ${{ steps.preparar.outputs.version }}
        run: |
          # --target ata el tag al commit compilado; si el tag ya existe, gh lo respeta.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Caaguazú $VERSION" \
            --notes-file .github/notas-release.md \
            --prerelease \
            entrega/*
