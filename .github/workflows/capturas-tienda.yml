# Saca las capturas para la ficha de la App Store, en los tres idiomas.
#
# Es aparte de "Captura de iOS" porque responde otra pregunta. Aquel existe
# para saber si la app dibuja, y corre en cada push; este arma lo que se sube a
# App Store Connect, y se corre a mano cuando el contenido del panel ya es el
# que se quiere mostrar. Lo que sale en las capturas es lo publicado en
# caaguazu.net en ese momento: con secciones vacias en el panel, salen vacias.
#
# Las capturas salen de un iPhone 16 Pro (1206 x 2622), que es la medida
# OBLIGATORIA en App Store Connect: "iPhone con Dynamic Island, pantalla
# mediana". Con esa sola alcanza para publicar; las demas medidas Apple las
# escala.
#
# El recorrido lo hace `ios/xcode/Pruebas/CapturasTiendaUITests.swift`.
