# Saca las capturas para la ficha de la App Store, en los tres idiomas.
#
# Es aparte de "Captura de iOS" porque responde otra pregunta. Aquel existe
# para saber si la app dibuja, y corre en cada push; este arma lo que se sube a
# App Store Connect, y se corre a mano cuando el contenido del panel ya es el
# que se quiere mostrar. Lo que sale en las capturas es lo publicado en
# caaguazu.net en ese momento: con secciones vacias en el panel, salen vacias.
#
# Las capturas salen de un iPhone 16 Pro (1206 x 2622), que es la medida
# OBLIGATORIA en App Store Connect: "iPhone con Dynamic Island, pantalla
# mediana". Con esa sola alcanza para publicar; las demas medidas Apple las
# escala.
#
# El recorrido lo hace `ios/xcode/Pruebas/CapturasTiendaUITests.swift`.
name: Capturas para la tienda

on:
  # TEMPORAL: workflow_dispatch solo dispara workflows que ya estan en main,
  # asi que para probar este antes de mezclarlo hace falta un push. Se saca
  # en cuanto la corrida haya dicho algo.
  push:
    branches: [claude/apk-programming-wczoo7]
    paths:
      - '.github/workflows/capturas-tienda.yml'
      - 'ios/xcode/Pruebas/CapturasTiendaUITests.swift'
  workflow_dispatch:
    inputs:
      idiomas:
        description: 'Idiomas, separados por espacio (es en pt)'
        type: string
        default: 'es en pt'

permissions:
  contents: read

jobs:
  capturas:
    runs-on: macos-15
    # Tres idiomas x ocho pantallas x un arranque nuevo por pantalla, mas la
    # compilacion. 50 deja margen y corta cualquier paso colgado.
    timeout-minutes: 50

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Misma clave que los otros workflows de iOS, para compartir el trabajo.
      - name: Cache de Gradle y de Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ios-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: ios-

      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      # Antes de compilar nada: si una seccion esta vacia en el panel, su
      # captura va a salir vacia, y conviene saberlo leyendo la primera linea
      # del log y no mirando la foto.
      - name: Que hay publicado en el panel
        run: |
          for RECURSO in inventario articulos recorridos eventos; do
            TOTAL=$(curl -sS -m 30 "https://caaguazu.net/wp-json/czu-app/v1/$RECURSO?idioma=es&por_pagina=1" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("total","?"))' 2>/dev/null || echo "?")
            echo "$RECURSO: $TOTAL"
            if [ "$TOTAL" = "0" ]; then
              echo "::warning::$RECURSO esta vacio en el panel: su captura va a salir vacia."
            fi
          done

      - name: Compilar el framework de Kotlin
        run: ./gradlew :ios:linkDebugFrameworkIosSimulatorArm64 --no-daemon

      # Mismo procedimiento que "Captura de iOS", con el mismo motivo: sin los
      # Compose Resources de maplibre-compose la app se cae al arrancar.
      - name: Juntar los recursos de Compose
        run: |
          ./gradlew :ios:syncComposeResourcesForIos --no-daemon || true
          DESTINO=ios/xcode/Generado/compose-resources
          rm -rf "$DESTINO"
          mkdir -p "$DESTINO"
          find . -type d -name "compose-resources" 2>/dev/null > /tmp/con-guion.txt
          find . -type d -name "composeResources" 2>/dev/null > /tmp/sin-guion.txt
          while read -r CARPETA; do
            [ -n "$CARPETA" ] && cp -R "$CARPETA/." "$DESTINO/" || true
          done < /tmp/con-guion.txt
          while read -r CARPETA; do
            [ -n "$CARPETA" ] && cp -R "$CARPETA" "$DESTINO/" || true
          done < /tmp/sin-guion.txt
          echo "archivos juntados: $(find "$DESTINO" -type f | wc -l | tr -d ' ')"

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto y compilar para pruebas
        working-directory: ios/xcode
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild \
            -project Turismo.xcodeproj \
            -scheme Turismo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath dd \
            build-for-testing

      - name: Arrancar un iPhone de la medida que pide la tienda
        id: simulador
        # Solo equipos cuya pantalla da una medida aceptada como obligatoria
        # (1206 x 2622 o 1179 x 2556). Si ninguno arranca se falla: una captura
        # de otra medida no sirve para lo que existe este workflow. El 17 va al
        # final porque una vez dejo `simctl` colgado 22 minutos en este runner
        # (ver "Captura de iOS").
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/equipos.json"
          python3 -c '
          import json, sys
          preferidos = ["iPhone 16 Pro", "iPhone 15 Pro", "iPhone 16", "iPhone 15",
                        "iPhone 17 Pro", "iPhone 17"]
          equipos = json.load(sys.stdin)["devices"]
          hallados = []
          for entorno, lista in equipos.items():
              if "iOS" not in entorno:
                  continue
              for e in lista:
                  if e.get("isAvailable") and e["name"] in preferidos:
                      hallados.append((preferidos.index(e["name"]), e["udid"], e["name"] + " (" + entorno.split(".")[-1] + ")"))
          for _, udid, descripcion in sorted(hallados):
              print(udid, descripcion)
          ' < "$RUNNER_TEMP/equipos.json" > "$RUNNER_TEMP/candidatos.txt"
          echo "--- candidatos ---"
          cat "$RUNNER_TEMP/candidatos.txt"

          # macOS no trae `timeout`; esta es la misma funcion que usa "Captura
          # de iOS", con el `pkill -P` que evita que un nieto huerfano deje el
          # paso colgado.
          con_limite() {
            local limite="$1"; shift
            "$@" &
            local trabajo=$!
            ( sleep "$limite"; pkill -P "$trabajo" 2>/dev/null; kill -9 "$trabajo" 2>/dev/null ) &
            local vigia=$!
            local salida=0
            wait "$trabajo" || salida=$?
            kill "$vigia" 2>/dev/null || true
            wait "$vigia" 2>/dev/null || true
            return "$salida"
          }

          ELEGIDO=""
          INTENTOS=0
          while read -r UDID DESCRIPCION; do
            [ -n "$UDID" ] || continue
            [ "$INTENTOS" -ge 3 ] && break
            INTENTOS=$((INTENTOS + 1))
            echo "--- intento $INTENTOS: $DESCRIPCION ---"
            con_limite 45 xcrun simctl boot "$UDID" || true
            if con_limite 120 xcrun simctl bootstatus "$UDID"; then
              ELEGIDO="$UDID"
              echo "arranco: $DESCRIPCION"
              break
            fi
            con_limite 30 xcrun simctl shutdown "$UDID" || true
          done < "$RUNNER_TEMP/candidatos.txt"

          test -n "$ELEGIDO" || { echo "Ningun iPhone de la medida de la tienda arranco."; exit 1; }
          echo "udid=$ELEGIDO" >> "$GITHUB_OUTPUT"

          open -a Simulator --args -CurrentDeviceUDID "$ELEGIDO"
          sleep 25

          # La barra de estado de las capturas de Apple: 9:41, bateria llena,
          # senal completa. Una hora cualquiera y una bateria a medias se ven
          # descuidadas en la ficha, y es lo primero que se mira.
          xcrun simctl status_bar "$ELEGIDO" override \
            --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 \
            --batteryState charged --batteryLevel 100 || true

      - name: Recorrer la app y fotografiar
        working-directory: ios/xcode
        timeout-minutes: 35
        env:
          UDID: ${{ steps.simulador.outputs.udid }}
          IDIOMAS: ${{ inputs.idiomas || 'es en pt' }}
        run: |
          mkdir -p ../../capturas-tienda
          for IDIOMA in $IDIOMAS; do
            echo "=== $IDIOMA ==="
            # TEST_RUNNER_ es el prefijo con que xcodebuild le pasa variables al
            # proceso del test; adentro llegan como IDIOMA y ESPERA.
            TEST_RUNNER_IDIOMA="$IDIOMA" TEST_RUNNER_ESPERA=12 xcodebuild test-without-building \
              -project Turismo.xcodeproj \
              -scheme Turismo \
              -destination "platform=iOS Simulator,id=$UDID" \
              -derivedDataPath dd \
              -only-testing:TurismoUITests/CapturasTiendaUITests \
              -resultBundlePath "../../capturas-tienda/$IDIOMA.xcresult" \
              > "../../capturas-tienda/salida-$IDIOMA.txt" 2>&1 \
              || echo "el recorrido en $IDIOMA termino con error; ver salida-$IDIOMA.txt"
            tail -15 "../../capturas-tienda/salida-$IDIOMA.txt"
          done

      - name: Ordenar y medir las capturas
        if: always()
        env:
          IDIOMAS: ${{ inputs.idiomas || 'es en pt' }}
        # Los adjuntos salen del .xcresult con nombres aleatorios; el manifiesto
        # dice cual es cual. Despues se mide cada una: lo que no sea una medida
        # aceptada o tenga canal alfa, App Store Connect lo rechaza al subirlo.
        run: |
          cd capturas-tienda
          for IDIOMA in $IDIOMAS; do
            [ -d "$IDIOMA.xcresult" ] || { echo "$IDIOMA: no hay resultado"; continue; }
            mkdir -p "crudo-$IDIOMA" "$IDIOMA"
            xcrun xcresulttool export attachments \
              --path "$IDIOMA.xcresult" --output-path "crudo-$IDIOMA"
            python3 - "$IDIOMA" <<'PY'
          import json, os, shutil, sys
          idioma = sys.argv[1]
          crudo = "crudo-" + idioma
          for prueba in json.load(open(os.path.join(crudo, "manifest.json"))):
              for a in prueba.get("attachments", []):
                  nombre = a["suggestedHumanReadableName"].split("_0_")[0]
                  shutil.copy(os.path.join(crudo, a["exportedFileName"]),
                              os.path.join(idioma, nombre + ".png"))
          PY
            rm -rf "crudo-$IDIOMA" "$IDIOMA.xcresult"

            for F in "$IDIOMA"/*.png; do
              [ -f "$F" ] || continue
              ANCHO=$(sips -g pixelWidth "$F" | awk '/pixelWidth/ {print $2}')
              ALTO=$(sips -g pixelHeight "$F" | awk '/pixelHeight/ {print $2}')
              ALFA=$(sips -g hasAlpha "$F" | awk '/hasAlpha/ {print $2}')
              case "${ANCHO}x${ALTO}" in
                1206x2622|1179x2556) MEDIDA="sirve para la tienda" ;;
                *) MEDIDA="NO es una medida obligatoria" ;;
              esac
              # Sin canal alfa: es requisito de Apple. Se pasa a JPEG, que no
              # lo tiene, solo si hiciera falta.
              if [ "$ALFA" = "yes" ]; then
                sips -s format jpeg -s formatOptions 100 "$F" --out "${F%.png}.jpg" >/dev/null
                rm "$F"
                F="${F%.png}.jpg"
              fi
              echo "$F: ${ANCHO}x${ALTO}, alfa=$ALFA — $MEDIDA"
            done
          done
          ls -R

      - name: Subir las capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-tienda
          path: capturas-tienda/
          retention-days: 90
