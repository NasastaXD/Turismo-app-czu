# Arranca la app de iOS en el simulador y saca una captura.
#
# Es la unica forma, desde un entorno sin Mac, de pasar de "el codigo compila"
# a "el mapa se ve". Sin esto, lo de iOS seria una promesa: el proyecto tiene
# una regla explicita contra dar por bueno lo que no se comprobo.
#
# Va aparte de "Verificar iOS" a proposito. Ese workflow tarda 1m40s con cache
# y conviene que siga siendo el ciclo rapido; este arma el proyecto de Xcode,
# compila una app entera y arranca un simulador, que es bastante mas lento.
name: Captura de iOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - 'compartido/**'
      - 'app/src/main/assets/map/**'
      - '.github/workflows/captura-ios.yml'

permissions:
  contents: read

jobs:
  captura:
    runs-on: macos-15
    # Con cache la corrida entera es de unos 4 minutos. 25 deja margen de sobra
    # para una corrida en frio y corta en seco cualquier paso que se cuelgue.
    timeout-minutes: 25

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Se cachea ~/.konan junto con Gradle: el compilador de Kotlin/Native se
      # baja aparte y pesa cientos de MB. Misma clave que "Verificar iOS" para
      # que los dos workflows compartan el trabajo ya hecho.
      - name: Cache de Gradle y de Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ios-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: ios-

      # Hace falta aunque aca no se compile nada de Android: `:compartido`
      # tiene un androidTarget y `:app` esta en el settings, asi que Gradle
      # configura los dos en cualquier invocacion.
      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Compilar el framework de Kotlin
        # Tiene que existir antes de que Xcode lo busque: el proyecto lo
        # referencia por ruta.
        run: ./gradlew :ios:linkDebugFrameworkIosSimulatorArm64 --no-daemon

      # Tiene que ir antes de generar el proyecto: XcodeGen exige que la
      # carpeta exista cuando arma el .xcodeproj.
      - name: Juntar los recursos de Compose
        run: |
          set -x
          DESTINO=ios/xcode/Generado/compose-resources
          rm -rf "$DESTINO"
          mkdir -p "$DESTINO"

          # Se buscan en lugar de escribir la ruta a mano: la salida de Gradle
          # para los Compose Resources de iOS cambio de lugar entre versiones
          # del plugin, y una ruta quemada se rompe en silencio — el sintoma
          # seria justo la caida que esto arregla. Si algun dia no aparece
          # nada, el `find` queda en el log y se ve.
          find ios/build compartido/build -type d -name "compose-resources" \
            2>/dev/null | tee /tmp/recursos.txt

          while read -r CARPETA; do
            [ -n "$CARPETA" ] && cp -R "$CARPETA/." "$DESTINO/" || true
          done < /tmp/recursos.txt

          echo "archivos juntados: $(find "$DESTINO" -type f | wc -l | tr -d ' ')"
          find "$DESTINO" -name "*.cvr" | head -10

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto de Xcode
        working-directory: ios/xcode
        run: |
          xcodegen generate
          ls -la Turismo.xcodeproj

      - name: Compilar la app para el simulador
        working-directory: ios/xcode
        run: |
          set -o pipefail
          xcodebuild \
            -project Turismo.xcodeproj \
            -scheme Turismo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath dd \
            build
          echo "--- lo que salio ---"
          ls -la dd/Build/Products/Debug-iphonesimulator/

      - name: Comprobar que el mapa viaja dentro de la app
        working-directory: ios/xcode
        # El fallo mas silencioso de todos: si Xcode aplana la carpeta del
        # mapa, el .app se arma igual, el mapa dibuja igual, y queda sin una
        # sola etiqueta. Mejor fallar aca, con un mensaje claro, que mirar una
        # captura sin nombres de calles y no saber por que.
        run: |
          APP=dd/Build/Products/Debug-iphonesimulator/Turismo.app
          echo "--- contenido de map/ dentro del .app ---"
          find "$APP/map" -maxdepth 2 | head -20

          test -f "$APP/map/caaguazu.pmtiles" \
            || { echo "FALTA el .pmtiles dentro del .app"; exit 1; }
          test -f "$APP/map/estilo.json" \
            || { echo "FALTA el estilo dentro del .app"; exit 1; }
          test -d "$APP/map/glifos" \
            || { echo "FALTA la carpeta de glifos: Xcode aplano la estructura"; exit 1; }

          GLIFOS=$(find "$APP/map/glifos" -name "*.pbf" | wc -l | tr -d ' ')
          echo "glifos empaquetados: $GLIFOS"
          test "$GLIFOS" -gt 0 \
            || { echo "La carpeta de glifos existe pero esta vacia"; exit 1; }

          echo "PMTiles: $(du -h "$APP/map/caaguazu.pmtiles" | cut -f1)"

      - name: Arrancar un simulador
        id: simulador
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          equipos = json.load(sys.stdin)["devices"]
          for entorno, lista in equipos.items():
              if "iOS" not in entorno:
                  continue
              for equipo in lista:
                  if equipo.get("isAvailable") and "iPhone" in equipo["name"]:
                      print(equipo["udid"], equipo["name"], entorno.split(".")[-1])
                      raise SystemExit
          raise SystemExit("no hay ningun simulador de iPhone disponible")
          ')
          echo "simulador elegido: $UDID"
          SOLO_UDID=$(echo "$UDID" | cut -d' ' -f1)
          echo "udid=$SOLO_UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$SOLO_UDID"
          # bootstatus espera hasta que el simulador termine de arrancar, en
          # lugar de adivinar con un sleep.
          xcrun simctl bootstatus "$SOLO_UDID"

          # Abrir Simulator.app, y esto es lo que faltaba. Un simulador
          # booteado solo con `simctl boot` corre headless: la app arranca y
          # corre —el registro lo probo dos veces, con la vista de Compose en
          # la jerarquia y MapLibre creando su runtime— pero no hay anfitrion
          # de interfaz que componga su ventana al framebuffer, asi que
          # `simctl io screenshot` devuelve el escritorio de SpringBoard y nada
          # mas. Dos corridas salieron asi, con la app viva durante las tres
          # capturas.
          open -a Simulator --args -CurrentDeviceUDID "$SOLO_UDID"

          # Y despues, tiempo para que SpringBoard termine de dibujar:
          # bootstatus vuelve cuando el sistema arranco, no cuando el
          # escritorio esta listo.
          sleep 25

      - name: Instalar y arrancar la app
        id: lanzamiento
        working-directory: ios/xcode
        # Techo corto: instalar y lanzar son cosa de segundos. La primera vez
        # `simctl launch` se colgo sin devolver nunca, y sin techo el job se
        # habria quedado horas ahi.
        timeout-minutes: 5
        env:
          UDID: ${{ steps.simulador.outputs.udid }}
        run: |
          # `set -x` y nada mas. NO va `timeout` alrededor de cada comando:
          # `timeout` es de GNU coreutils y macOS no lo trae, asi que el
          # envoltorio que estaba aca para robustecer el paso era lo que lo
          # rompia — "timeout: command not found", codigo 127. El techo real es
          # el `timeout-minutes` de arriba, que es nativo de Actions y no
          # depende de que comandos traiga el sistema; combinado con `set -x`,
          # si algo se cuelga el log deja dicho en cual de los dos comandos
          # fue, que es la informacion que hacia falta.
          set -x
          mkdir -p ../../capturas
          xcrun simctl install "$UDID" \
            dd/Build/Products/Debug-iphonesimulator/Turismo.app

          xcrun simctl terminate "$UDID" net.caaguazu.turismo || true

          # El primer lanzamiento va con la consola atada y en segundo plano,
          # y es lo que faltaba para diagnosticar: Kotlin/Native escribe
          # "Uncaught Kotlin exception: <mensaje>" a **stderr**, no al registro
          # unificado del sistema. Por eso `log show` mostraba la caida
          # —terminateWithUnhandledException en la pila del informe— pero nunca
          # el motivo. Esto lo guarda en un archivo que va al artefacto.
          nohup xcrun simctl launch --console-pty \
            "$UDID" net.caaguazu.turismo \
            > ../../capturas/salida-de-la-app.txt 2>&1 &

          # Y el segundo lo trae al frente. Sobre una app ya viva `launch` no
          # reinicia nada, y la consola del primero sigue atada y capturando.
          sleep 12
          SALIDA=$(xcrun simctl launch "$UDID" net.caaguazu.turismo)
          echo "$SALIDA"

          # El pid queda para el paso de las capturas: con eso, una falla
          # distingue "la app se murio" de "esta viva pero no se ve", que son
          # dos problemas completamente distintos.
          echo "pid=$(echo "$SALIDA" | sed 's/.*: //')" >> "$GITHUB_OUTPUT"

          # Y el Info.plist que genero XcodeGen, una vez, para descartarlo como
          # causa sin tener que suponer nada.
          plutil -p dd/Build/Products/Debug-iphonesimulator/Turismo.app/Info.plist \
            | grep -iE "URL_BASE|LaunchScreen|Scene|Bundle(Identifier|Name)|DeviceFamily" || true

      - name: Sacar las capturas
        timeout-minutes: 5
        env:
          UDID: ${{ steps.simulador.outputs.udid }}
          PID: ${{ steps.lanzamiento.outputs.pid }}
        # Tres capturas y no una: una sola en blanco no distingue entre lento y
        # roto. Con tres se lee la secuencia — si el mapa aparece en la segunda
        # o la tercera, tarda; si no aparece en ninguna, no llega.
        run: |
          set -x
          mkdir -p capturas

          viva() {
            if [ -n "$PID" ] && xcrun simctl spawn "$UDID" ps -p "$PID" > /dev/null 2>&1; then
              echo "la app sigue viva (pid $PID)"
            else
              echo "OJO: la app ya no esta viva (pid $PID)"
            fi
          }

          sleep 8
          viva
          xcrun simctl io "$UDID" screenshot capturas/1-a-los-8-segundos.png
          sleep 17
          viva
          xcrun simctl io "$UDID" screenshot capturas/2-a-los-25-segundos.png
          sleep 20
          viva
          xcrun simctl io "$UDID" screenshot capturas/3-a-los-45-segundos.png

          # Si las tres son identicas, la pantalla nunca cambio, y eso conviene
          # que se lea en el log sin tener que bajar los PNG.
          md5 capturas/*.png
          ls -la capturas/

      - name: Guardar el registro de la app
        if: always()
        env:
          UDID: ${{ steps.simulador.outputs.udid }}
        # Si el mapa no aparece, MapLibre deja dicho por que en el registro del
        # sistema — y ahi es donde se ve si `pmtiles://` no resolvio.
        run: |
          mkdir -p capturas
          if [ -z "$UDID" ]; then
            echo "el simulador nunca arranco: no hay registro que traer" \
              | tee capturas/registro-de-la-app.txt
            exit 0
          fi
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "Turismo"' \
            > capturas/registro-de-la-app.txt 2>&1 || true
          tail -40 capturas/registro-de-la-app.txt || true

          # Los informes de caida del simulador viven en el disco del runner,
          # no dentro del simulador. Sin esto, una caida se ve solo como "la
          # app dejo de estar viva" y hay que deducir por que; con el informe,
          # dice la senal y la pila. Costo cero y ahorra una vuelta entera.
          mkdir -p capturas/caidas
          find ~/Library/Logs/DiagnosticReports -iname "*Turismo*" -maxdepth 2 \
            -exec cp {} capturas/caidas/ \; 2>/dev/null || true
          echo "informes de caida encontrados: $(ls -1 capturas/caidas | wc -l | tr -d ' ')"

          # Lo que escribio la app a stdout/stderr: aca esta el mensaje de una
          # excepcion de Kotlin, que es lo que el informe de caida no trae.
          echo "=== salida de la app (stdout y stderr) ==="
          cat capturas/salida-de-la-app.txt 2>/dev/null || echo "(no se capturo)"

      - name: Subir las capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captura-ios
          path: capturas/
          retention-days: 30
