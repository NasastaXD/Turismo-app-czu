# Arranca la app de iOS en el simulador y saca una captura.
#
# Es la unica forma, desde un entorno sin Mac, de pasar de "el codigo compila"
# a "el mapa se ve". Sin esto, lo de iOS seria una promesa: el proyecto tiene
# una regla explicita contra dar por bueno lo que no se comprobo.
#
# Va aparte de "Verificar iOS" a proposito. Ese workflow tarda 1m40s con cache
# y conviene que siga siendo el ciclo rapido; este arma el proyecto de Xcode,
# compila una app entera y arranca un simulador, que es bastante mas lento.
name: Captura de iOS

on:
  workflow_dispatch:
  push:
    paths:
    # `interfaz/**` es la mas importante de las cuatro y es la que faltaba: ahi
    # viven las pantallas y el sistema visual, o sea casi todo lo que puede
    # romper el lado de iOS. Sin ella, un cambio en una pantalla no disparaba
    # nada y el primer aviso llegaba recien en el push siguiente que tocara otra
    # carpeta. Paso: un arreglo de tres lineas en `interfaz/src/iosMain` no
    # disparo ninguna corrida.
      #
      # Y el mapa ya no esta en `app/src/main/assets`: se mudo con el codigo que
      # lo lee. La ruta vieja apuntaba a una carpeta que no existe.
      - 'interfaz/**'
      - 'ios/**'
      - 'compartido/**'
      - '.github/workflows/captura-ios.yml'

permissions:
  contents: read

jobs:
  captura:
    runs-on: macos-15
    # Con cache la corrida entera es de unos 4 minutos. 25 deja margen de sobra
    # para una corrida en frio y corta en seco cualquier paso que se cuelgue.
    timeout-minutes: 25

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Se cachea ~/.konan junto con Gradle: el compilador de Kotlin/Native se
      # baja aparte y pesa cientos de MB. Misma clave que "Verificar iOS" para
      # que los dos workflows compartan el trabajo ya hecho.
      - name: Cache de Gradle y de Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ios-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: ios-

      # Hace falta aunque aca no se compile nada de Android: `:compartido`
      # tiene un androidTarget y `:app` esta en el settings, asi que Gradle
      # configura los dos en cualquier invocacion.
      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Compilar el framework de Kotlin
        # Tiene que existir antes de que Xcode lo busque: el proyecto lo
        # referencia por ruta.
        run: ./gradlew :ios:linkDebugFrameworkIosSimulatorArm64 --no-daemon

      # Tiene que ir antes de generar el proyecto: XcodeGen exige que la
      # carpeta exista cuando arma el .xcodeproj.
      - name: Juntar los recursos de Compose
        run: |
          set -x

          # Que tareas de recursos existen, preguntado a Gradle y no recordado:
          # el nombre cambio entre versiones del plugin de Compose y ya hubo
          # una vuelta perdida por dar una ruta por buena.
          ./gradlew :ios:tasks --all --no-daemon 2>/dev/null \
            | grep -iE "resource" || echo "(ninguna tarea de recursos en :ios)"

          # La tarea que Compose Multiplatform agrega para iOS. Va con
          # `|| true` porque si no existe con ese nombre, lo que manda es el
          # listado de arriba y el `find` de abajo.
          ./gradlew :ios:syncComposeResourcesForIos --no-daemon || true

          DESTINO=ios/xcode/Generado/compose-resources
          rm -rf "$DESTINO"
          mkdir -p "$DESTINO"

          # Los recursos de las dependencias no salen del codigo de :ios —que
          # no tiene ninguno— sino de una variante publicada aparte:
          # maplibre-compose declara `iosSimulatorArm64ResourcesElements`. Asi
          # que se busca ancho: en el arbol de compilacion y en la cache de
          # Gradle, por los dos nombres que usa el plugin.
          echo "--- carpetas compose-resources ---"
          find . -type d -name "compose-resources" 2>/dev/null | tee /tmp/con-guion.txt
          echo "--- carpetas composeResources ---"
          find . -type d -name "composeResources" 2>/dev/null | tee /tmp/sin-guion.txt
          echo "--- archivos .cvr donde sea ---"
          find . ~/.gradle/caches/modules-2 -name "*.cvr" 2>/dev/null | head -20

          # `compose-resources/` ya tiene la forma que espera el bundle, asi
          # que se copia su contenido tal cual.
          while read -r CARPETA; do
            [ -n "$CARPETA" ] && cp -R "$CARPETA/." "$DESTINO/" || true
          done < /tmp/con-guion.txt

          # `composeResources/` es el nivel de adentro: va como subcarpeta.
          while read -r CARPETA; do
            [ -n "$CARPETA" ] && cp -R "$CARPETA" "$DESTINO/" || true
          done < /tmp/sin-guion.txt

          echo "archivos juntados: $(find "$DESTINO" -type f | wc -l | tr -d ' ')"
          find "$DESTINO" -name "*.cvr" | head -10

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto de Xcode
        working-directory: ios/xcode
        run: |
          xcodegen generate
          ls -la Turismo.xcodeproj

      - name: Compilar la app para el simulador
        working-directory: ios/xcode
        run: |
          set -o pipefail
          xcodebuild \
            -project Turismo.xcodeproj \
            -scheme Turismo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath dd \
            build
          echo "--- lo que salio ---"
          ls -la dd/Build/Products/Debug-iphonesimulator/

      - name: Comprobar que el mapa viaja dentro de la app
        working-directory: ios/xcode
        # El fallo mas silencioso de todos: si Xcode aplana la carpeta del
        # mapa, el .app se arma igual, el mapa dibuja igual, y queda sin una
        # sola etiqueta. Mejor fallar aca, con un mensaje claro, que mirar una
        # captura sin nombres de calles y no saber por que.
        run: |
          APP=dd/Build/Products/Debug-iphonesimulator/Turismo.app
          echo "--- contenido de map/ dentro del .app ---"
          find "$APP/map" -maxdepth 2 | head -20

          test -f "$APP/map/caaguazu.pmtiles" \
            || { echo "FALTA el .pmtiles dentro del .app"; exit 1; }
          test -f "$APP/map/estilo.json" \
            || { echo "FALTA el estilo dentro del .app"; exit 1; }
          test -d "$APP/map/glifos" \
            || { echo "FALTA la carpeta de glifos: Xcode aplano la estructura"; exit 1; }

          GLIFOS=$(find "$APP/map/glifos" -name "*.pbf" | wc -l | tr -d ' ')
          echo "glifos empaquetados: $GLIFOS"
          test "$GLIFOS" -gt 0 \
            || { echo "La carpeta de glifos existe pero esta vacia"; exit 1; }

          echo "PMTiles: $(du -h "$APP/map/caaguazu.pmtiles" | cut -f1)"

          # Y el icono. App Store Connect rechaza una subida sin el, asi que
          # comprobar que `actool` corrio y dejo los PNG derivados adentro es
          # comprobar algo que de otro modo se descubre al subir.
          echo "--- iconos dentro del .app ---"
          ls -1 "$APP" | grep -i appicon || true
          test -n "$(ls -1 "$APP" | grep -i appicon)" \
            || { echo "FALTA el icono: el catalogo no se compilo"; exit 1; }

      - name: Arrancar un simulador
        id: simulador
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          equipos = json.load(sys.stdin)["devices"]
          for entorno, lista in equipos.items():
              if "iOS" not in entorno:
                  continue
              for equipo in lista:
                  if equipo.get("isAvailable") and "iPhone" in equipo["name"]:
                      print(equipo["udid"], equipo["name"], entorno.split(".")[-1])
                      raise SystemExit
          raise SystemExit("no hay ningun simulador de iPhone disponible")
          ')
          echo "simulador elegido: $UDID"
          SOLO_UDID=$(echo "$UDID" | cut -d' ' -f1)
          echo "udid=$SOLO_UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$SOLO_UDID"
          # bootstatus espera hasta que el simulador termine de arrancar, en
          # lugar de adivinar con un sleep.
          xcrun simctl bootstatus "$SOLO_UDID"

          # Abrir Simulator.app, y esto es lo que faltaba. Un simulador
          # booteado solo con `simctl boot` corre headless: la app arranca y
          # corre —el registro lo probo dos veces, con la vista de Compose en
          # la jerarquia y MapLibre creando su runtime— pero no hay anfitrion
          # de interfaz que componga su ventana al framebuffer, asi que
          # `simctl io screenshot` devuelve el escritorio de SpringBoard y nada
          # mas. Dos corridas salieron asi, con la app viva durante las tres
          # capturas.
          open -a Simulator --args -CurrentDeviceUDID "$SOLO_UDID"

          # Y despues, tiempo para que SpringBoard termine de dibujar:
          # bootstatus vuelve cuando el sistema arranco, no cuando el
          # escritorio esta listo.
          sleep 25

      - name: Sostener la app al frente con XCUITest y fotografiar
        id: lanzamiento
        working-directory: ios/xcode
        timeout-minutes: 12
        env:
          UDID: ${{ steps.simulador.outputs.udid }}
        # Aca esta el cambio de enfoque, y la razon esta medida, no supuesta:
        # `simctl launch` deja la app en ForegroundInactive —lo dice el propio
        # registro del sistema— y entonces `simctl io screenshot` compone el
        # escritorio de SpringBoard en lugar de la app. La app corre, dibuja el
        # mapa con Metal y hasta pide por red con exito; lo unico que no hace
        # es quedar activa.
        #
        # `XCUIApplication().launch()` si la activa. Asi que el test la
        # sostiene al frente cuarenta y cinco segundos mientras el host saca
        # las capturas desde afuera. Cada herramienta en lo que sabe hacer.
        run: |
          set -x
          mkdir -p ../../capturas

          # El test corre en segundo plano y deja su salida en un archivo: es
          # donde aparece un "Uncaught Kotlin exception", que no va al registro
          # unificado del sistema.
          nohup xcodebuild test \
            -project Turismo.xcodeproj \
            -scheme Turismo \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath dd \
            -resultBundlePath ../../capturas/resultado.xcresult \
            > ../../capturas/salida-de-la-app.txt 2>&1 &
          echo $! > /tmp/pid-xcodebuild

          # Hay que darle tiempo a que compile el target de pruebas, instale y
          # active. Recien despues tiene sentido fotografiar.
          sleep 45

          for INTENTO in 1 2 3; do
            xcrun simctl io "$UDID" screenshot \
              "../../capturas/$INTENTO-captura.png" || true
            sleep 12
          done

          md5 ../../capturas/*.png || true
          ls -la ../../capturas/

          # Se espera al test para que su resultado y sus propios adjuntos
          # queden completos. Si falla no se corta el paso: las capturas del
          # host ya estan, y el log dice por que fallo.
          wait "$(cat /tmp/pid-xcodebuild)" || true

      - name: Guardar el registro de la app
        if: always()
        env:
          UDID: ${{ steps.simulador.outputs.udid }}
        # Si el mapa no aparece, MapLibre deja dicho por que en el registro del
        # sistema — y ahi es donde se ve si `pmtiles://` no resolvio.
        run: |
          mkdir -p capturas
          if [ -z "$UDID" ]; then
            echo "el simulador nunca arranco: no hay registro que traer" \
              | tee capturas/registro-de-la-app.txt
            exit 0
          fi
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "Turismo"' \
            > capturas/registro-de-la-app.txt 2>&1 || true
          tail -40 capturas/registro-de-la-app.txt || true

          # Los informes de caida del simulador viven en el disco del runner,
          # no dentro del simulador. Sin esto, una caida se ve solo como "la
          # app dejo de estar viva" y hay que deducir por que; con el informe,
          # dice la senal y la pila. Costo cero y ahorra una vuelta entera.
          mkdir -p capturas/caidas
          find ~/Library/Logs/DiagnosticReports -iname "*Turismo*" -maxdepth 2 \
            -exec cp {} capturas/caidas/ \; 2>/dev/null || true
          echo "informes de caida encontrados: $(ls -1 capturas/caidas | wc -l | tr -d ' ')"

          # Lo que escribio la app a stdout/stderr: aca esta el mensaje de una
          # excepcion de Kotlin, que es lo que el informe de caida no trae.
          echo "=== salida de la app (stdout y stderr) ==="
          tail -60 capturas/salida-de-la-app.txt 2>/dev/null || echo "(no se capturo)"

          # Las capturas que el propio test adjunto al resultado, como segunda
          # via por si las del host salieran mal. Se extraen y se tira el
          # .xcresult: es un bundle de miles de archivos y no tiene sentido
          # subirlo entero.
          if [ -d capturas/resultado.xcresult ]; then
            mkdir -p capturas/del-test
            xcrun xcresulttool export attachments \
              --path capturas/resultado.xcresult \
              --output-path capturas/del-test 2>/dev/null \
              || echo "(no se pudieron extraer los adjuntos del test)"
            find capturas/del-test -type f | head -10
            rm -rf capturas/resultado.xcresult
          fi

      - name: Subir las capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captura-ios
          path: capturas/
          retention-days: 30

      # El camino a la App Store no es el simulador: es un telefono. Hasta
      # ahora nada comprobaba esa mitad, y estaba rota — la firma apagada para
      # todo y el framework buscado solo en la carpeta del simulador. Va al
      # final a proposito: si falla, la captura ya quedo subida.
      #
      # Sin firmar, que es lo unico que un runner sin cuenta de desarrollador
      # no puede hacer. Compilar y enlazar si, y es donde estaba el problema.
      - name: Comprobar que tambien compila para un telefono
        run: |
          set -o pipefail
          ./gradlew :ios:linkDebugFrameworkIosArm64 --no-daemon
          cd ios/xcode
          xcodebuild \
            -project Turismo.xcodeproj \
            -scheme Turismo \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath dd-telefono \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          echo "--- lo que salio para telefono ---"
          ls -la dd-telefono/Build/Products/Debug-iphoneos/
          APP=dd-telefono/Build/Products/Debug-iphoneos/Turismo.app
          # Que el binario sea de verdad arm64 de telefono y no otra cosa.
          lipo -info "$APP/Turismo"
