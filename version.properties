# La version de la app, en un solo sitio.
#
# La leen dos cosas que no se hablan entre si: `app/build.gradle.kts`, para el
# APK y el bundle, y el workflow "Publicar iOS", para el Info.plist del .ipa.
#
# Antes el numero estaba escrito en los dos lados y ya habia derivado: Android
# iba en 1.6.0 y el proyecto de Xcode seguia diciendo 0.1.0, asi que la primera
# subida a App Store Connect habria salido etiquetada nueve releases atras —y
# el numero de version de una app publicada no se corrige, se sube otra.
#
#   nombre  lo que ve la gente         (versionName / CFBundleShortVersionString)
#   codigo  el entero que las dos tiendas exigen que crezca en cada subida
#           (versionCode / CFBundleVersion)
#
# `ios/xcode/project.yml` repite estos dos valores como respaldo para un build
# local, y "Verificar iOS" falla si se desincronizan.
nombre=1.6.0
codigo=18
