# Versiones fijadas al techo real: android-37 todavia no existe como plataforma,
# asi que compileSdk 36 manda. Cada version de aqui fue verificada contra el
# minCompileSdk que declara su propio artefacto.
[versions]
agp = "8.13.2"
kotlin = "2.4.10"
# Compose Multiplatform, para la version de iOS. Es la pareja documentada de
# Kotlin 2.4.10; no es lo mismo que `compose` de abajo, que es el androidx que
# usa el modulo :app y no se toca.
composeMultiplatform = "1.11.1"
# Envoltorio de MapLibre para Compose Multiplatform. API todavia inestable
# —rompe entre versiones menores— y por eso queda fijada exacta.
maplibreCompose = "0.17.0"
coreKtx = "1.18.0"
activityCompose = "1.13.0"
compose = "1.11.4"
lifecycle = "2.9.4"
maplibre = "11.11.0"
serialization = "1.9.0"
coil = "3.2.0"
coroutines = "1.10.2"
work = "2.10.1"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
# Solo el runtime, y solo por @Immutable en los modelos del contrato. Se
# verifico que este artefacto publica variantes iosArm64 e iosSimulatorArm64
# (no publica iosX64: por eso el simulador Intel queda afuera de los targets).
compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "compose" }
compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
maplibre = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }
maplibre-compose = { group = "org.maplibre.compose", name = "maplibre-compose", version.ref = "maplibreCompose" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
# El nucleo de red de Coil, sin motor. Lo usa iOS: el motor se escribe a
# mano sobre NSURLSession en unas cincuenta lineas, y asi iOS no arrastra
# Ktor ni su motor Darwin —dos dependencias nuevas— solo para bajar fotos.
# La interfaz que hay que implementar es UN metodo; verificado en el
# artefacto, no supuesto.
coil-network-core = { group = "io.coil-kt.coil3", name = "coil-network-core", version.ref = "coil" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-work = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
